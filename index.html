<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calorias">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f1117">
    <title>Contador de Calorias IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #222535;
            --border: rgba(255,255,255,0.08);
            --border2: rgba(255,255,255,0.14);
            --text: #f0f0f0;
            --text2: #8a8fa8;
            --text3: #555a70;
            --green: #22c87a;
            --green-dim: rgba(34,200,122,0.12);
            --amber: #f5a623;
            --amber-dim: rgba(245,166,35,0.12);
            --red: #ff5c5c;
            --red-dim: rgba(255,92,92,0.12);
            --blue: #4d9fff;
            --blue-dim: rgba(77,159,255,0.12);
            --radius: 14px;
            --radius-sm: 8px;
            --font: 'DM Sans', sans-serif;
            --mono: 'DM Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); }
        body { display: flex; flex-direction: column; }

        /* Header & Tabs */
        .header { padding: max(env(safe-area-inset-top), 16px) 20px 0; background: var(--bg); flex-shrink: 0; }
        .header-inner { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 22px; font-weight: 500; }
        .header-date { font-size: 12px; color: var(--text2); font-family: var(--mono); }
        
        .tab-bar { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
        .tab { flex: 1; min-width: 80px; padding: 12px 8px; font-size: 12px; font-weight: 500; text-align: center; color: var(--text3); border: none; background: none; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--green); border-bottom-color: var(--green); }

        /* Content */
        .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .section { display: none; padding: 20px; padding-bottom: 40px; }
        .section.active { display: block; }

        /* Elements */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
        .label { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-box { background: var(--surface2); border-radius: var(--radius-sm); padding: 14px 12px; }
        .sval { font-size: 22px; font-weight: 500; font-family: var(--mono); }

        /* Progress Bar */
        .prog-bg { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin: 10px 0; }
        .prog-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }

        /* AI Photo Styles */
        .ai-dropzone { border: 2px dashed var(--border2); border-radius: var(--radius); padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .ai-dropzone:active { background: var(--surface2); border-color: var(--blue); }
        .loader { width: 24px; height: 24px; border: 3px solid var(--surface2); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Inputs & Buttons */
        input, select { width: 100%; padding: 11px 14px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); outline: none; margin-bottom: 8px; }
        .btn-primary { width: 100%; padding: 14px; background: var(--green); color: #0f1117; border: none; border-radius: var(--radius-sm); font-weight: 500; cursor: pointer; }
        .btn-secondary { width: 100%; padding: 10px; background: transparent; color: var(--text2); border: 1px solid var(--border2); border-radius: var(--radius-sm); cursor: pointer; }
        
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
        .food-cal { color: var(--green); font-family: var(--mono); font-weight: 500; }
        
        .save-btn-wrap { padding: 12px 20px; background: var(--bg); border-top: 1px solid var(--border); padding-bottom: max(env(safe-area-inset-bottom), 12px); }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--surface2); padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: 0.3s; z-index: 100; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <h1>Calorias</h1>
        <span class="header-date" id="hdr-date"></span>
    </div>
</div>

<div class="tab-bar">
    <button class="tab active" onclick="showTab('hoje')">Hoje</button>
    <button class="tab" onclick="showTab('foto')">Foto</button>
    <button class="tab" onclick="showTab('historico')">Histórico</button>
    <button class="tab" onclick="showTab('perfil')">Perfil</button>
    <button class="tab" onclick="showTab('resumo')">Resumo</button>
</div>

<div class="content">
    <!-- HOJE -->
    <div id="tab-hoje" class="section active">
        <div class="card">
            <div style="display:flex; justify-content:space-between">
                <span class="prog-title">Hoje</span>
                <span style="font-family:var(--mono)"><span id="cal-consumed">0</span> / <span id="cal-goal-display">—</span> kcal</span>
            </div>
            <div class="prog-bg"><div class="prog-fill" id="cal-bar" style="width:0%; background:var(--green)"></div></div>
            <div id="cal-rest" style="font-size:12px; color:var(--text2)">Configura o perfil para a meta.</div>
        </div>
        <div class="label">Adicionar Manual</div>
        <div class="card">
            <input type="text" id="custom-name" placeholder="Nome do alimento">
            <div style="display:flex; gap:8px">
                <input type="number" id="custom-cal" placeholder="kcal">
                <button class="btn-primary" style="width:60px" onclick="addCustom()">+</button>
            </div>
        </div>
        <div id="food-list"></div>
    </div>

    <!-- FOTO IA -->
    <div id="tab-foto" class="section">
        <div class="card" style="border: 1px dashed var(--blue); background: var(--blue-dim);">
            <div class="label" style="color:var(--blue)">Chave API Gemini/Google</div>
            <input type="password" id="api-key-input" placeholder="Insere a tua chave aqui...">
            <button class="btn-secondary" onclick="saveApiKey()">Guardar Chave no iPhone</button>
        </div>

        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)">
        <div class="ai-dropzone" onclick="document.getElementById('camera-input').click()">
            <span style="font-size:40px">📸</span>
            <p><strong>Tirar foto à refeição</strong></p>
            <p style="font-size:12px; color:var(--text2)">A IA identifica alimentos e calorias.</p>
        </div>

        <div id="ai-results" style="margin-top:20px; display:none">
            <div id="ai-loading" style="text-align:center; display:none">
                <div class="loader"></div>
                <p>A analisar com IA...</p>
            </div>
            <div id="ai-items-list"></div>
        </div>
    </div>

    <!-- OUTRAS SECÇÕES (Simplificadas para o código caber) -->
    <div id="tab-historico" class="section"><div id="day-cards"></div></div>
    <div id="tab-perfil" class="section">
        <div class="label">O teu perfil</div>
        <input type="number" id="peso" placeholder="Peso (kg)" oninput="calcProfile()">
        <input type="number" id="altura" placeholder="Altura (cm)" oninput="calcProfile()">
        <input type="number" id="idade" placeholder="Idade" oninput="calcProfile()">
        <select id="actividade" onchange="calcProfile()">
            <option value="1.2">Sedentário</option>
            <option value="1.55" selected>Moderado</option>
        </select>
        <div id="profile-result" class="card" style="margin-top:15px; display:none">
            Meta: <span id="meta-val">0</span> kcal
        </div>
    </div>
    <div id="tab-resumo" class="section"><div id="summary-list"></div></div>
</div>

<div class="save-btn-wrap" id="save-btn-wrap">
    <button class="btn-primary" onclick="saveDay()">Guardar dia e avançar →</button>
</div>

<div class="toast" id="toast"></div>

<script>
    // Dados e Estado
    let foodLog = JSON.parse(localStorage.getItem('calorias_hoje') || '[]');
    let history = JSON.parse(localStorage.getItem('calorias_historico') || '[]');
    let profile = JSON.parse(localStorage.getItem('calorias_perfil') || '{"meta":0}');

    function save() {
        localStorage.setItem('calorias_hoje', JSON.stringify(foodLog));
        localStorage.setItem('calorias_historico', JSON.stringify(history));
        localStorage.setItem('calorias_perfil', JSON.stringify(profile));
    }

    function toast(m) {
        const t = document.getElementById('toast');
        t.textContent = m; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Navegação
    function showTab(t) {
        document.querySelectorAll('.tab').forEach((el, i) => {
            el.classList.toggle('active', ['hoje', 'foto', 'historico', 'perfil', 'resumo'][i] === t);
        });
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        document.getElementById('save-btn-wrap').style.display = t === 'hoje' ? 'block' : 'none';
    }

    // Lógica IA (Foto)
    function saveApiKey() {
        const k = document.getElementById('api-key-input').value;
        localStorage.setItem('calorias_api_key', k);
        toast('Chave guardada!');
    }

    async function handleImage(e) {
        const file = e.target.files[0];
        const key = localStorage.getItem('calorias_api_key');
        if (!key) return toast('Insere a Chave API primeiro!');

        document.getElementById('ai-results').style.display = 'block';
        document.getElementById('ai-loading').style.display = 'block';
        
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const base64 = reader.result.split(',')[1];
            await analyzePhoto(base64, key);
        };
    }

    async function analyzePhoto(base64, key) {
        const prompt = "Analisa a foto. Identifica alimentos e estima kcal, prot, carb, fat. Responde APENAS JSON: [{\"name\":\"...\",\"cal\":100,\"prot\":10,\"carb\":10,\"fat\":5}]";
        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
            });
            const data = await resp.json();
            const items = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ""));
            renderAIResults(items);
        } catch (err) {
            toast('Erro na análise!');
        } finally {
            document.getElementById('ai-loading').style.display = 'none';
        }
    }

    function renderAIResults(items) {
        const list = document.getElementById('ai-items-list');
        list.innerHTML = items.map(item => `
            <div class="food-item" style="border-left: 3px solid var(--blue)">
                <div><strong>${item.name}</strong><br><small>${item.cal} kcal</small></div>
                <button class="btn-primary" style="width:40px" onclick='addAIFood(${JSON.stringify(item)})'>+</button>
            </div>
        `).join('');
    }

    function addAIFood(item) {
        foodLog.push(item); save(); renderLog(); updateProgress(); toast('Adicionado!');
    }

    // Lógica Manual e Perfil
    function addCustom() {
        const n = document.getElementById('custom-name').value;
        const c = parseInt(document.getElementById('custom-cal').value);
        if (!n || !c) return;
        foodLog.push({ name: n, cal: c, prot: 0, carb: 0, fat: 0 });
        save(); renderLog(); updateProgress();
        document.getElementById('custom-name').value = ''; document.getElementById('custom-cal').value = '';
    }

    function renderLog() {
        const el = document.getElementById('food-list');
        el.innerHTML = foodLog.map((f, i) => `
            <div class="food-item">
                <span>${f.name}</span>
                <span class="food-cal">${f.cal} kcal</span>
            </div>
        `).join('');
    }

    function updateProgress() {
        const total = foodLog.reduce((s, f) => s + f.cal, 0);
        document.getElementById('cal-consumed').textContent = total;
        if (profile.meta > 0) {
            document.getElementById('cal-goal-display').textContent = profile.meta;
            const pct = Math.min((total / profile.meta) * 100, 100);
            document.getElementById('cal-bar').style.width = pct + '%';
        }
    }

    function calcProfile() {
        const p = parseFloat(document.getElementById('peso').value);
        const a = parseFloat(document.getElementById('altura').value);
        const i = parseFloat(document.getElementById('idade').value);
        if (!p || !a || !i) return;
        const meta = Math.round((10 * p + 6.25 * a - 5 * i + 5) * 1.5); // Simplificado
        profile = { peso: p, altura: a, idade: i, meta: meta };
        save();
        document.getElementById('profile-result').style.display = 'block';
        document.getElementById('meta-val').textContent = meta;
        updateProgress();
    }

    function saveDay() {
        if (!foodLog.length) return toast('Regista algo primeiro!');
        history.unshift({ date: new Date().toLocaleDateString(), cal: foodLog.reduce((s, f) => s + f.cal, 0) });
        foodLog = []; save(); renderLog(); updateProgress();
        toast('Dia guardado!');
    }

    // Init
    document.getElementById('hdr-date').textContent = new Date().toLocaleDateString();
    if (localStorage.getItem('calorias_api_key')) document.getElementById('api-key-input').value = localStorage.getItem('calorias_api_key');
    renderLog();
    updateProgress();
</script>

</body>
</html>
